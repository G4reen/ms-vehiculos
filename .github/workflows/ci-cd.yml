name: CI/CD ms-vehiculos

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # 1) Pruebas unitarias + cobertura JaCoCo
  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ejecutar pruebas (JUnit + Mockito) y generar cobertura JaCoCo
        run: ./mvnw -B verify
      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/site/jacoco/

  # 2) Análisis estático y Quality Gate con SonarCloud (IE5, IE6)
  sonar:
    name: Calidad de código (SonarCloud)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y generar reporte JaCoCo
        run: ./mvnw -B verify
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - uses: SonarSource/sonarqube-auth-action@v1.2
        id: auth
      - name: SonarQube Scan + Quality Gate
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        with:
          args: >
            -Dsonar.organization=g4reen
            -Dsonar.projectKey=G4reen_ms-vehiculos
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true

  # 3) Análisis de seguridad con Snyk (IE5, IE6). Si falla, bloquea el pipeline.
  security:
    name: Análisis de seguridad (Snyk)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master
      - name: Snyk - dependencias (bloquea con severidad high o superior)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high
      - name: Snyk Code - análisis estático del código
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

  # 4) Construcción de la imagen Docker. Solo se publica si pasan test, sonar y security.
  build-image:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: [test, sonar, security]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login en GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre y tags de la imagen (trazabilidad por SHA)
        id: meta
        run: |
          IMG="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=${IMG}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "base=${IMG}" >> "$GITHUB_OUTPUT"
      - name: Build (y push si es main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.base }}:${{ github.sha }}
            ${{ steps.meta.outputs.base }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 5) Despliegue automático (lo actualizaremos a Kubernetes en AWS en el siguiente paso)
  deploy:
    name: Despliegue (Docker Compose)
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: produccion-simulada
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Levantar stack con la imagen del commit
        env:
          APP_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 12)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 12)"
            echo "APP_IMAGE=${APP_IMAGE}"
          } > .env
          docker compose pull app
          docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:9004/
          curl --fail http://localhost:9004/api/v1/vehiculos
      - name: Logs en caso de falla
        if: failure()
        run: docker compose logs --no-color
      - name: Resumen de despliegue (trazabilidad)
        run: |
          {
            echo "### Despliegue exitoso"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Imagen: \`${{ needs.build-image.outputs.image }}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apagar entorno simulado
        if: always()
        run: docker compose down -v

  # 6) Alerta: abre un issue si cualquier etapa falla
  notify-failure:
    name: Alerta de falla
    runs-on: ubuntu-latest
    needs: [test, sonar, security, build-image, deploy]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Crear issue de alerta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Pipeline fallido en ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --body "Fallo el pipeline. Revisar: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"