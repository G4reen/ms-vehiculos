apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-vehiculos
spec:
  replicas: 2
  selector:
    matchLabels: {app: ms-vehiculos}
  template:
    metadata:
      labels: {app: ms-vehiculos}
    spec:
      containers:
        - name: ms-vehiculos
          image: ghcr.io/OWNER/REPO:latest   # reemplazar por el SHA del commit
          ports:
            - containerPort: 9004
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/vehiculos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: vehiculos-db-secret, key: DB_USERNAME}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: vehiculos-db-secret, key: DB_PASSWORD}}
          readinessProbe:
            httpGet: {path: /, port: 9004}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 9004}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ms-vehiculos
spec:
  type: NodePort
  selector: {app: ms-vehiculos}
  ports:
    - port: 9004
      targetPort: 9004
      nodePort: 30004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-vehiculos-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-vehiculos
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
