apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-vehiculos
spec:
  replicas: 2
  selector:
    matchLabels: {app: ms-vehiculos}
  template:
    metadata:
      labels: {app: ms-vehiculos}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ms-vehiculos
          image: ghcr.io/g4reen/ms-vehiculos:0.0.1-SNAPSHOT
          ports:
            - containerPort: 9004
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/vehiculos?sslMode=PREFERRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: vehiculos-db-secret, key: DB_USERNAME}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: vehiculos-db-secret, key: DB_PASSWORD}}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 9004}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: 9004}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 150m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ms-vehiculos
  labels: {app: ms-vehiculos}
spec:
  type: NodePort
  selector: {app: ms-vehiculos}
  ports:
    - name: http
      port: 9004
      targetPort: 9004
      nodePort: 30004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-vehiculos-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-vehiculos
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ms-vehiculos-monitor
  namespace: default
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: ms-vehiculos
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s