apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: vehiculos
            - name: MYSQL_USER
              valueFrom: {secretKeyRef: {name: vehiculos-db-secret, key: DB_USERNAME}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: vehiculos-db-secret, key: DB_PASSWORD}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: vehiculos-db-secret, key: MYSQL_ROOT_PASSWORD}}
          readinessProbe:
            tcpSocket: {port: 3306}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: {app: mysql}
  ports:
    - port: 3306
      targetPort: 3306
